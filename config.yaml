# Central configuration for the coin sorter.
# Copy to config.local.yaml to override any value for a specific machine
# (config.local.yaml is gitignored).

camera:
  # Picamera2 main stream resolution. 1280x720 is a sane default for the Pi
  # Camera Module 3 — bump to 1536x864 or 1920x1080 if you need finer detail.
  width: 1280
  height: 720
  framerate: 30
  # Optional manual exposure / gain — null means auto.
  exposure_us: null
  analogue_gain: null
  # Region of interest as fractions of the full frame: (x, y, w, h). Use this
  # to crop down to just the belt region before classification. null = full frame.
  roi: null

serial:
  port: /dev/ttyACM0
  baud: 115200
  timeout_s: 1.0
  # How long to wait between reconnect attempts after a disconnect.
  reconnect_delay_s: 1.0

model:
  # Path to the ONNX classifier (relative to repo root or absolute).
  # If missing, infer.py falls back to a stub classifier so the pipeline
  # can run end-to-end before training is complete.
  path: models/coin_classifier.onnx
  # Input size the model was trained at. Must match Colab `imgsz`.
  input_size: 224
  # Channel order the model expects. YOLO-cls expects RGB.
  channel_order: rgb
  # Normalization. YOLO ONNX exports embed scaling, so identity is correct
  # for an Ultralytics ONNX export. Override for other model families.
  mean: [0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0]

classifier:
  # Below this confidence, the coin is routed to the "reject" bin.
  confidence_threshold: 0.80
  # Class label order — MUST match the training data folder names sorted
  # alphabetically (this is how YOLO-cls assigns class indices).
  labels:
    - dime
    - nickel
    - penny
    - quarter
    - reject

sorter:
  # Frames per second to actually run inference on (motion gating will
  # further reduce this in practice).
  inference_fps: 10
  # Cooldown after sending a SORT command, so we do not double-classify
  # the same coin.
  cooldown_ms: 250

capture:
  # Belt-fed training-data capture (used by coin_sorter.capture). The belt runs
  # continuously with a single denomination loaded; the gate below ensures we
  # only save frames that actually contain a coin, tightly cropped so the coin
  # fills the saved image. All values can be overridden in config.local.yaml.
  #
  # Master switch. true = only save gated, coin-present frames. false = legacy
  # behaviour (save the ROI-cropped frame every --interval, no detection).
  gate: true
  # Segmentation method for the presence gate:
  #   brightness — per-frame intensity threshold (Otsu or fixed). Motion-
  #                invariant, so robust on a moving belt. Preferred.
  #   absdiff    — rolling-median background subtraction. Fallback for when the
  #                coin and belt are too close in brightness to threshold.
  method: brightness
  # Gaussian blur kernel (odd) applied before thresholding to kill sensor noise.
  blur_ksize: 5
  # Blob area filter as a FRACTION of the ROI area (resolution-independent).
  # A detection only counts as a coin if min <= area/roi_area <= max.
  min_area_frac: 0.02
  max_area_frac: 0.60
  # Circularity = 4*pi*area / perimeter^2 (1.0 = perfect circle). Rejects belt
  # seams, shadows and debris streaks. Coins are round, so keep this high.
  min_circularity: 0.65
  # brightness method: fixed grayscale threshold, or null to use Otsu.
  bright_thresh: null
  # Set true if coins are DARKER than the belt (e.g. dark coins on a bright belt).
  invert: false
  # absdiff method: number of frames in the rolling-median background, and the
  # per-pixel difference threshold that counts as foreground.
  bg_window: 25
  absdiff_thresh: 25
  # Dedup — one physical coin spans many consecutive frames as it travels:
  #   centroid_band — save once, when the coin centroid first crosses a virtual
  #                   trip line across the belt. One sample per coin. Default.
  #   min_interval  — save at most once per min_interval_s while a coin is
  #                   present. A few pose samples per coin.
  #   none          — save every gated frame (many near-duplicates).
  dedup_mode: centroid_band
  # Axis the coins travel along: "y" (top->bottom) or "x" (left->right).
  travel_axis: y
  # Trip-line position and half-width as fractions of the ROI along travel_axis.
  band_center_frac: 0.5
  band_halfwidth_frac: 0.08
  # Minimum seconds between saves. Acts as a per-coin cadence in min_interval
  # mode and as a global jam safety-valve in all modes.
  min_interval_s: 0.6
  # Tight-crop framing: pad the coin bbox by this fraction of its longest side,
  # and (optionally) make the crop square and centred on the coin centroid.
  crop_pad_frac: 0.25
  crop_square: true
  # Optional belt driving from the capture tool: the firmware's non-blocking
  # RUN <hz> command keeps the belt moving while we capture. Default off; enable
  # with --drive-belt or set true here. Keep the speed gentle so coins do not
  # blow past the dedup band between frames.
  drive_belt: false
  belt_speed_hz: 800
  # WS2812 ring light (on the Pico, GP16) for even, consistent illumination.
  # On by default for every capture/calibrate session and turned off on exit.
  # Keep it neutral white (R=G=B) so copper/silver render true for the model;
  # lower the values if the frame is over-exposed.
  lights: true
  light_rgb: [180, 180, 180]
  # Label whose capture bypasses the single-coin gate (debris/empty/multi-coin).
  reject_label: reject

dataset:
  raw_dir: data/raw
  processed_dir: data/processed
  # Train/val split fraction (val = 1 - train_frac).
  train_frac: 0.85
  # Random seed for the split.
  seed: 1337

training:
  # Base model — see README for YOLOv8 vs YOLO11 discussion.
  base_model: yolo11n-cls.pt
  epochs: 50
  batch: 64
  imgsz: 224
  # Where Ultralytics will write training runs (inside Colab).
  project: runs
  name: coin_classifier
  # Optimizer / LR are left to Ultralytics defaults; override here if needed.
  patience: 15

# Where things go on Google Drive — used by scripts/zip_dataset.sh and the
# Colab notebook to keep paths consistent.
drive:
  base_dir: MyDrive/coin_sorter
  dataset_zip: MyDrive/coin_sorter/data.zip
  model_dir: MyDrive/coin_sorter/models
