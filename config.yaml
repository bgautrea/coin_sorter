# Central configuration for the coin sorter.
# Copy to config.local.yaml to override any value for a specific machine
# (config.local.yaml is gitignored).

camera:
  # Picamera2 main stream resolution. 1280x720 is a sane default for the Pi
  # Camera Module 3 — bump to 1536x864 or 1920x1080 if you need finer detail.
  width: 1280
  height: 720
  framerate: 30
  # Optional manual exposure / gain — null means auto.
  exposure_us: null
  analogue_gain: null
  # Region of interest as fractions of the full frame: (x, y, w, h). Use this
  # to crop down to just the belt region before classification. null = full frame.
  roi: null
  # Autofocus for the Arducam 64MP (uses libcamera AfMode via picamera2):
  #   manual     — lock the lens at `lens_position` dioptres (0=infinity .. ~15=
  #                close). Best for the fixed-distance belt: sharp and repeatable,
  #                no hunting on the low-contrast belt. Find the value with the
  #                focus slider in cam_test/stream.py, then set it here.
  #   continuous — camera refocuses continuously (works out of the box, but may
  #                hunt). Good for first light before you've dialed in a value.
  #   auto       — one-shot autofocus at startup, then locked.
  af_mode: continuous
  # Lens position in dioptres, used when af_mode is "manual". null until tuned.
  lens_position: null
  # White balance. Lock it for consistent colour under the ring light — auto-WB
  # casts a tint under the LEDs' narrow spectrum, which muddies the copper-vs-
  # silver cue the classifier relies on. awb: auto | manual.
  awb: auto
  # [red, blue] gain multipliers, used when awb is "manual". Find them with the
  # web tool (python -m coin_sorter.webcal). null until tuned.
  colour_gains: null

serial:
  port: /dev/ttyACM0
  baud: 115200
  timeout_s: 1.0
  # How long to wait between reconnect attempts after a disconnect.
  reconnect_delay_s: 1.0

model:
  # Path to the ONNX classifier (relative to repo root or absolute).
  # If missing, infer.py falls back to a stub classifier so the pipeline
  # can run end-to-end before training is complete.
  path: models/coin_classifier.onnx
  # Input size the model was trained at. Must match Colab `imgsz`.
  input_size: 224
  # Channel order the model expects. YOLO-cls expects RGB.
  channel_order: rgb
  # Normalization. YOLO ONNX exports embed scaling, so identity is correct
  # for an Ultralytics ONNX export. Override for other model families.
  mean: [0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0]

classifier:
  # Below this confidence, the coin is routed to the "check" bin.
  confidence_threshold: 0.80
  # Class label order — MUST match the training data folder names sorted
  # alphabetically (this is how YOLO-cls assigns class indices).
  #
  # Labels are (denomination, design, side). The goal is to pull collectible
  # varieties out of a mixed batch, and the identifying design is often on one
  # side only: a wheat cent's obverse is the same Lincoln as a memorial cent,
  # so heads-up it is ambiguous and only the reverse (or the date) tells.
  # Capture one design per batch, then tag sides in the webcal gallery.
  labels:
    - dime_barber_obv
    - dime_barber_rev
    - dime_mercury_obv
    - dime_mercury_rev
    - dime_roosevelt_obv
    - dime_roosevelt_rev
    - dime_seated_obv
    - dime_seated_rev
    - half_franklin_obv
    - half_franklin_rev
    - half_walking_obv
    - half_walking_rev
    - nickel_buffalo_obv
    - nickel_buffalo_rev
    - nickel_jefferson_obv
    - nickel_jefferson_rev
    - nickel_liberty_obv        # "V" nickel
    - nickel_liberty_rev
    - nickel_shield_obv
    - nickel_shield_rev
    - penny_indian_obv
    - penny_indian_rev
    - penny_lincoln_obv         # wheat / memorial / shield all share this obverse
    - penny_memorial_rev
    - penny_shield_rev
    - penny_steel_obv           # 1943 steel cent: grey from either side, so both sides -> keep
    - penny_steel_rev
    - penny_wheat_obv
    - penny_wheat_rev
    - quarter_standing_obv
    - quarter_standing_rev
    - quarter_washington_obv
    - quarter_washington_rev
    - reject                    # debris, foreign, clusters, empty belt

sorter:
  # Physical bins. Three is the minimum for the multi-pass strategy:
  #   keep    — positively identified as what you are hunting for
  #   reject  — positively identified as something you do not want
  #   recheck — everything else, and the DEFAULT. Re-feed this pile.
  #
  # `recheck` is the centre position, which is where the dish rests. That is
  # deliberate: a coin nothing aimed the dish for — one the detector never saw,
  # one in a pile, one the gate threw out as a cluster — falls wherever the
  # dish happens to be. Those coins are UNEXAMINED, not common, and they must
  # land in the pile that gets re-fed. A coin in the wrong keep pile is a
  # nuisance; an unexamined coin in the discard pile is gone.
  #
  # Which designs are `keep` and which are `reject` is per-session: hunting
  # shield cents makes them the reject and a wheat the keep. Set it in the
  # webcal sorting panel rather than here.
  #
  # Labels not listed, and anything below confidence_threshold, go to
  # `default_bin`.
  default_bin: recheck
  sort_map:
    keep:
      - dime_barber_obv
      - dime_barber_rev
      - dime_mercury_obv
      - dime_mercury_rev
      - dime_seated_obv
      - dime_seated_rev
      - half_franklin_obv
      - half_franklin_rev
      - half_walking_obv
      - half_walking_rev
      - nickel_buffalo_obv
      - nickel_buffalo_rev
      - nickel_liberty_obv
      - nickel_liberty_rev
      - nickel_shield_obv
      - nickel_shield_rev
      - penny_indian_obv
      - penny_indian_rev
      - penny_steel_obv
      - penny_steel_rev
      - penny_wheat_obv         # experiment: same design as penny_lincoln_obv, differs only by date
      - penny_wheat_rev
      - quarter_standing_obv
      - quarter_standing_rev
    reject:
      - dime_roosevelt_obv
      - dime_roosevelt_rev
      - nickel_jefferson_obv
      - nickel_jefferson_rev
      - penny_memorial_rev
      - penny_shield_rev
      - quarter_washington_obv
      - quarter_washington_rev
    recheck:
      - penny_lincoln_obv
      - reject

  # Frames per second to actually run inference on (motion gating will
  # further reduce this in practice).
  inference_fps: 10
  # Cooldown after sending a SORT command, so we do not double-classify
  # the same coin.
  cooldown_ms: 250
  # Seconds a coin takes to travel from the camera's trip line to the roller
  # nose, where it tips onto the dish. The classifier decides far upstream of
  # the diverter, so the divert must be SCHEDULED for the coin's arrival, not
  # sent immediately -- at ~240 mm and ~7.9 mm/s that is ~30 s, and roughly 15
  # coins are in flight at once. Aiming on detection would mean every coin
  # landed in whichever bin the newest coin upstream called for.
  #
  # MEASURE this, do not compute it. Over 30 s a 5% error in belt speed is a
  # 1.5 s timing error, and 550 Hz -> 7.9 mm/s is approximate and slips. Drop
  # one coin, note the detection timestamp in the log, and time it to the nose:
  #   python -m coin_sorter.sorter --belt-hz 550 --no-sort --measure-transport
  transport_delay_s: 30.0
  # Aim this far BEFORE the coin is due at the nose. The dish must be settled
  # when the coin tips off, not still moving -- so the lead covers the servo
  # slew and settle plus a margin for belt-speed drift over the transport.
  divert_lead_s: 0.75
  # After a coin has passed, return the dish here. Defaults to default_bin,
  # which is the whole point: unscheduled arrivals land in the re-feed pile.
  neutral_bin: recheck
  # How long after a divert to wait before returning to neutral. The dish is
  # on target from (arrival - divert_lead_s) to (that + neutral_after_s), so:
  #
  #     late tolerance = neutral_after_s - divert_lead_s
  #
  # This must comfortably exceed the lead, or a coin arriving a little late
  # finds the dish already back at centre and lands in the re-feed pile --
  # which looks like "it moved too early" and is really "it let go too soon".
  # Skipped if another divert is due sooner, so a dense run does not bounce
  # the servo back and forth.
  neutral_after_s: 1.75
  # How long the dish holds a bin before the next scheduled divert may move it.
  # Must exceed the servo settle (SERVO_SETTLE_MS in firmware, 300 ms) plus the
  # coin's fall; it bounds how closely spaced arrivals can be.
  divert_hold_s: 0.5

capture:
  # Belt-fed training-data capture (used by coin_sorter.capture). The belt runs
  # continuously with a single denomination loaded; the gate below ensures we
  # only save frames that actually contain a coin, tightly cropped so the coin
  # fills the saved image. All values can be overridden in config.local.yaml.
  #
  # Master switch. true = only save gated, coin-present frames. false = legacy
  # behaviour (save the ROI-cropped frame every --interval, no detection).
  gate: true
  # Segmentation method for the presence gate:
  #   brightness — per-frame intensity threshold (Otsu or fixed). Motion-
  #                invariant, so robust on a moving belt. Preferred.
  #   absdiff    — rolling-median background subtraction. Fallback for when the
  #                coin and belt are too close in brightness to threshold.
  method: brightness
  # Gaussian blur kernel (odd) applied before thresholding to kill sensor noise.
  blur_ksize: 5
  # Blob area filter as a FRACTION of the ROI area (resolution-independent).
  # A detection only counts as a coin if min <= area/roi_area <= max.
  # At 1280x720 full-frame ROI one coin is ~0.13 (dime) to ~0.38 (half).
  # At ~22 px/mm a nickel is ~0.18, a quarter ~0.24, a half dollar ~0.38; the
  # fill/isolation tests (below) are what reject clusters, not max_area.
  min_area_frac: 0.02
  max_area_frac: 0.45
  # Circularity = 4*pi*area / perimeter^2 (1.0 = perfect circle). Rejects belt
  # seams, shadows and debris streaks. Coins are round, so keep this high.
  min_circularity: 0.75
  # Single-coin gate — all three reject clusters and partial coins, which would
  # otherwise be saved under the class label and poison training:
  #   min_fill_frac — blob area / area of its minimum enclosing circle. One
  #                   coin ~0.95, two overlapping coins ~0.6. Far more decisive
  #                   than circularity for touching coins.
  #   reject_border — skip blobs touching the ROI edge (coin partly out of frame).
  #   isolate       — skip a coin if any other blob (bigger than
  #                   isolate_min_frac of the ROI) would land inside its crop.
  min_fill_frac: 0.85
  reject_border: true
  isolate: true
  isolate_min_frac: 0.002
  # brightness method: fixed grayscale threshold, or null to use Otsu.
  bright_thresh: null
  # Set true if coins are DARKER than the belt (e.g. dark coins on a bright belt).
  invert: false
  # absdiff method: number of frames in the rolling-median background, and the
  # per-pixel difference threshold that counts as foreground.
  bg_window: 25
  absdiff_thresh: 25
  # How often (in frames) to recompute the median background. The background is
  # nearly static, so recomputing every frame is wasted work that tanks the
  # framerate; refresh every bg_refresh frames instead. Defaults to bg_window.
  bg_refresh: 25
  # Dedup — one physical coin spans many consecutive frames as it travels:
  #   centroid_band — save once, when the coin centroid first crosses a virtual
  #                   trip line across the belt. One sample per coin. Default.
  #   min_interval  — save at most once per min_interval_s while a coin is
  #                   present. A few pose samples per coin.
  #   none          — save every gated frame (many near-duplicates).
  dedup_mode: centroid_band
  # Axis the coins travel along: "y" (top->bottom) or "x" (left->right).
  travel_axis: y
  # Trip-line position and half-width as fractions of the ROI along travel_axis.
  band_center_frac: 0.5
  band_halfwidth_frac: 0.08
  # Minimum seconds between saves. Acts as a per-coin cadence in min_interval
  # mode and as a global jam safety-valve in all modes.
  min_interval_s: 0.6
  # Tight-crop framing: pad the coin bbox by this fraction of its longest side,
  # and (optionally) make the crop square and centred on the coin centroid.
  crop_pad_frac: 0.25
  crop_square: true
  # Optional belt driving from the capture tool: the firmware's non-blocking
  # RUN <hz> command keeps the belt moving while we capture. Default off; enable
  # with --drive-belt or set true here. Keep the speed gentle so coins do not
  # blow past the dedup band between frames.
  drive_belt: false
  belt_speed_hz: 550           # tuned 2026-09-16: coins stay in frame, no blur at 1500us
  # Coin feeder (second stepper, firmware FRUN). Rate that reliably ejects coins
  # one at a time onto the belt on this rig; the webcal Feeder slider starts here.
  feeder_speed_hz: 8650        # tuned 2026-09-16
  # Feeder pulsing: run the feeder for feeder_on_ms out of every
  # feeder_period_ms so the belt clears each burst before the next. This is the
  # coin-spacing knob; 0 = run continuously.
  feeder_on_ms: 0
  feeder_period_ms: 2000
  # WS2812 ring light (on the Pico, GP16) for even, consistent illumination.
  # On by default for every capture/calibrate session and turned off on exit.
  # Keep it neutral white (R=G=B) so copper/silver render true for the model;
  # lower the values if the frame is over-exposed.
  lights: true
  light_rgb: [180, 180, 180]
  # Label whose capture bypasses the single-coin gate (debris/empty/multi-coin).
  reject_label: reject

dataset:
  raw_dir: data/raw
  processed_dir: data/processed
  # Training "views". data/raw is the permanent source of truth and keeps the
  # finest labels you ever made; a view projects it into the class set you want
  # to TRAIN, without moving a single file. Build one with:
  #     python scripts/build_trainset.py --view <name>
  # Rules are ordered, first match wins, fnmatch globs against the raw folder
  # name. A null target excludes those images from that view.
  views:
    # v0: denomination only. Trains on ALL captures including the side-less
    # nickel/ dime/ penny/ folders - proves the whole loop with data in hand.
    denomination:
      rules:
        # Genuine gate failures (see scripts/triage_quarantine.py): clusters,
        # coins cut off at the crop edge, overlaps. NOT _triage/clean, which is
        # the nickel_bluewb set - correctly framed but shot under the wrong
        # white balance, and colour is the copper/silver cue.
        - ["_triage/cluster", "reject"]
        - ["_triage/partial", "reject"]
        - ["_triage/overlap", "reject"]
        - ["quarter*", "quarter"]
        - ["nickel*",  "nickel"]
        - ["dime*",    "dime"]
        - ["penny*",   "penny"]
        - ["half*",    "half"]
        - ["reject*",  "reject"]
        - ["*",        null]
    # Dimes, one class per design, same philosophy as pennies_fine.
    #
    # The trap is the wreath: Barber dimes (1892-1916) reused the Seated
    # Liberty "ONE DIME" cereal-wreath reverse (1860-1891) unchanged, so those
    # two reverses are the same design and genuinely undecidable. They get one
    # class, `dime_wreath_rev`, rather than a coin-flip between two. Unlike
    # penny_obverse it is not a re-feed case: both are 90% silver keepers, so
    # it maps straight to keep. Barber and Seated are only split on the
    # obverse, where they differ.
    dimes_fine:
      max_per_class: 300
      rules:
        - ["dime_roosevelt_*",  "dime_roosevelt"]
        - ["dime_mercury_*",    "dime_mercury"]
        - ["dime_barber_obv",   "dime_barber_obv"]
        - ["dime_seated_obv",   "dime_seated_obv"]
        - ["dime_barber_rev",   "dime_wreath_rev"]
        - ["dime_seated_rev",   "dime_wreath_rev"]
        - ["dime",              null]            # side-less, design unknown
        - ["penny*",            "reject"]        # not a dime
        - ["nickel*",           "reject"]
        - ["_triage/cluster",   "reject"]
        - ["_triage/partial",   "reject"]
        - ["_triage/overlap",   "reject"]
        - ["*",                 null]
    # Pennies, one class per design. Prefer this over `pennies`: the model
    # should be as fine-grained as the data allows and the GROUPING should
    # happen at run time in the sorting panel. Baking keeper/common into the
    # classes means retraining every time you want to hunt something else;
    # here, isolating shield cents is three button clicks.
    #
    # penny_obverse is still its own class for the reason below: a Lincoln
    # obverse is genuinely undecidable, so it belongs in the re-feed pile.
    pennies_fine:
      max_per_class: 300
      rules:
        - ["penny_memorial_*",  "penny_memorial"]
        - ["penny_shield_*",    "penny_shield"]
        - ["penny_wheat_rev",   "penny_wheat"]
        - ["penny_indian_*",    "penny_indian"]
        - ["penny_steel_*",     "penny_steel"]
        - ["penny_lincoln_obv", "penny_obverse"]
        - ["penny_wheat_obv",   "penny_obverse"]
        - ["nickel*",           "reject"]
        - ["dime*",             "reject"]
        - ["_triage/cluster",   "reject"]
        - ["_triage/partial",   "reject"]
        - ["_triage/overlap",   "reject"]
        - ["*",                 null]
    # Pennies. The interesting one, because a cent's obverse is genuinely
    # undecidable: wheat, memorial and shield all share the same Lincoln
    # obverse and differ only by the date, which is ~10 px at imgsz 224. So
    # `penny_obverse` is its own class -- an honest "this is a Lincoln cent,
    # face up, and I cannot tell which" -- and it belongs in the recheck pile.
    # Re-fed, that coin eventually lands reverse-up and gets decided. That is
    # the whole multi-pass strategy, expressed as a class.
    #
    # penny_wheat_obv folds in there too: it IS a Lincoln obverse. Training it
    # as a keeper would teach the model to read dates it cannot resolve.
    pennies:
      max_per_class: 300
      rules:
        - ["penny_wheat_rev",  "penny_keeper"]
        - ["penny_indian_*",   "penny_keeper"]
        - ["penny_steel_*",    "penny_keeper"]
        - ["penny_memorial_*", "penny_common"]
        - ["penny_shield_*",   "penny_common"]
        - ["penny_lincoln_obv", "penny_obverse"]
        - ["penny_wheat_obv",   "penny_obverse"]
        - ["nickel*",          "reject"]        # not a penny
        - ["dime*",            "reject"]
        - ["_triage/cluster",  "reject"]
        - ["_triage/partial",  "reject"]
        - ["_triage/overlap",  "reject"]
        - ["*",                null]
    # Nickels only: the first view that answers the question the machine is
    # actually for -- is this one worth keeping? Three classes matching three
    # bins, so the confidence threshold alone produces the "cannot tell" case.
    #
    # obv/rev are collapsed because every nickel design here is identifiable
    # from BOTH sides (Buffalo: Native American / bison; Liberty: Liberty head
    # / big V; Jefferson: Jefferson / Monticello). That doubles the images per
    # class. It is NOT true for cents, where a wheat and a memorial share the
    # same obverse -- so do not copy this pattern to a pennies view.
    #
    # Pennies and dimes fold into `reject` on purpose: feed a non-nickel and it
    # lands in `check` rather than being forced into a nickel class.
    nickels:
      # Keepers are inherently rare -- 123 images against 639 Jeffersons and
      # 1735 non-nickels. Cap the big classes so the model cannot win by
      # always guessing the majority.
      max_per_class: 300
      rules:
        - ["nickel_buffalo_*",   "nickel_keeper"]
        - ["nickel_liberty_*",   "nickel_keeper"]
        - ["nickel_shield_*",    "nickel_keeper"]
        - ["nickel_jefferson_*", "nickel_common"]
        - ["nickel",             null]            # side-less, design unknown
        - ["penny*",             "reject"]        # not a nickel -> check bin
        - ["dime*",              "reject"]
        - ["_triage/cluster",    "reject"]
        - ["_triage/partial",    "reject"]
        - ["_triage/overlap",    "reject"]
        - ["*",                  null]
    # v1: fine-grained, but only the classes with enough samples to learn.
    # Everything else stays in data/raw for a later view; at run time those
    # coins fall to the `check` bin via the confidence threshold.
    fine_v1:
      rules:
        - ["_triage/cluster",      "reject"]
        - ["_triage/partial",      "reject"]
        - ["_triage/overlap",      "reject"]
        - ["dime_roosevelt_obv",   "dime_roosevelt_obv"]
        - ["dime_roosevelt_rev",   "dime_roosevelt_rev"]
        - ["nickel_jefferson_obv", "nickel_jefferson_obv"]
        - ["nickel_jefferson_rev", "nickel_jefferson_rev"]
        - ["penny_lincoln_obv",    "penny_lincoln_obv"]
        - ["penny_memorial_rev",   "penny_memorial_rev"]
        - ["penny_shield_rev",     "penny_shield_rev"]
        - ["quarter_washington_*", "quarter_washington_*"]
        - ["reject",               "reject"]
        - ["*",                    null]
  # Train/val split fraction (val = 1 - train_frac).
  train_frac: 0.85
  # Random seed for the split.
  seed: 1337

training:
  # Base model — see README for YOLOv8 vs YOLO11 discussion.
  base_model: yolo11n-cls.pt
  epochs: 50
  batch: 64
  imgsz: 224
  # Where Ultralytics will write training runs (inside Colab).
  project: runs
  name: coin_classifier
  # Optimizer / LR are left to Ultralytics defaults; override here if needed.
  patience: 15

# Where things go on Google Drive — used by scripts/zip_dataset.sh and the
# Colab notebook to keep paths consistent.
drive:
  base_dir: MyDrive/coin_sorter
  dataset_zip: MyDrive/coin_sorter/data.zip
  model_dir: MyDrive/coin_sorter/models
